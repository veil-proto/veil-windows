name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Build (windows)
        run: GOOS=windows go build ./...
      - name: Vet (windows)
        run: GOOS=windows go vet ./...
      - name: Test OS-neutral packages
        run: go test ./control/
